version: "1.0"
rule:
  id: "extract-chains"
  name: "提取调用链"
  description: "从代码中提取调用链，识别 bridge 调用和业务流"
  
  responsibilities:
    - "提取函数调用链"
    - "识别 bridge 调用点"
    - "标记 UI 流和业务流"
    - "计算链路置信度"
  
  constraints:
    - "基于画像结果"
    - "不修改代码"
    - "输出结构化链图"
  
  preconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/analysis/obfuscation_profile.json"
  
  action:
    type: "cli"
    command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} extract-chains"
    working_dir: "{workspace}"
    timeout: 300
  
  postconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/analysis/chain_graph.json"
    - type: "json_path"
      file: "{workspace}/output/{run_id}/analysis/chain_graph.json"
      json_path: "items"
      condition: "length > 0"
  
  on_failure:
    action: "stop"
  
  metadata:
    author: "restorex"
    version: "1.0"
    tags: ["analysis", "chain", "bridge"]
