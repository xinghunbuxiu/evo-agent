version: "1.0"
rule:
  id: "finalize"
  name: "收尾"
  description: "生成最终报告，更新状态，准备交付"
  
  responsibilities:
    - "生成 final_summary"
    - "生成 handoff_package"
    - "更新模块状态文档"
    - "清理临时文件"
  
  constraints:
    - "必须生成交付物"
    - "保存状态供后续追溯"
  
  preconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/reports/verify_report.json"
  
  action:
    type: "cli"
    command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} finalize"
    working_dir: "{workspace}"
    timeout: 120
  
  postconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/reports/final_summary.json"
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/reports/handoff_package.json"
  
  # 状态更新（可选）
  side_effects:
    - type: "update_file"
      file: "{workspace}/docs/RESTORE_MODULE_STATUS_4.4.11_CN.md"
      template: "status_template.md"
  
  on_failure:
    action: "continue"  # 最后一步，不影响结果
  
  metadata:
    author: "restorex"
    version: "1.0"
    tags: ["finalize", "delivery", "summary"]
    is_terminal: true  # 流程终点
