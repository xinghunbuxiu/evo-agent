version: "1.0"
rule:
  id: "infer-build-origin"
  name: "推断构建来源"
  description: "分析 bundle 的构建来源（Vue、React、普通 JS 等）"
  
  responsibilities:
    - "识别构建工具"
    - "判断混淆程度"
    - "标记文件来源类型"
  
  constraints:
    - "仅分析，不还原"
    - "不生成源码"
    - "输出结构化报告"
  
  preconditions:
    - type: "directory_exists"
      path: "{workspace}/output/{run_id}/baseline/normalized_working_copy"
  
  action:
    type: "cli"
    command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} infer-build-origin"
    working_dir: "{workspace}"
    timeout: 300
  
  postconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/analysis/build_origin_report.json"
    - type: "json_path"
      file: "{workspace}/output/{run_id}/analysis/build_origin_report.json"
      json_path: "items"
      condition: "length > 0"
  
  on_failure:
    action: "stop"
  
  metadata:
    author: "restorex"
    version: "1.0"
    tags: ["analysis", "origin"]
