version: "1.0"
rule:
  id: "build-source-project"
  name: "构建源码项目"
  description: "生成重建的工程结构，包括 reconstructed_project 和 source_project"
  
  responsibilities:
    - "生成 reconstructed_project"
    - "生成 source_project"
    - "创建工程配置文件"
    - "准备可运行环境"
  
  constraints:
    - "基于还原结果"
    - "保持保真度"
    - "不修改业务逻辑"
  
  preconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/analysis/source_reconstruction/module_graph.json"
  
  action:
    type: "sequential"
    steps:
      - name: "build-reconstructed-project"
        type: "cli"
        command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} build-reconstructed-project"
        timeout: 300
      - name: "build-source-project"
        type: "cli"
        command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} build-source-project"
        timeout: 300
  
  postconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/reconstructed_project/src/main.ts"
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/reconstructed_project_raw/src/main.ts"
  
  on_failure:
    action: "continue"
  
  metadata:
    author: "restorex"
    version: "1.0"
    tags: ["reconstruction", "project", "vite"]
