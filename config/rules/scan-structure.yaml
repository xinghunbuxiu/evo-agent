version: "1.0"
rule:
  id: "scan-structure"
  name: "扫描结构"
  description: "扫描 bundle 的整体结构，识别文件关系和入口点"
  
  responsibilities:
    - "识别模块边界"
    - "分析依赖图"
    - "标记入口文件"
  
  constraints:
    - "不修改文件"
    - "仅静态分析"
    - "输出结构图"
  
  preconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/analysis/build_origin_report.json"
  
  action:
    type: "cli"
    command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} scan-structure"
    working_dir: "{workspace}"
    timeout: 300
  
  postconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/analysis/structure_scan.json"
    - type: "json_path"
      file: "{workspace}/output/{run_id}/analysis/structure_scan.json"
      json_path: "items"
      condition: "exists"
  
  on_failure:
    action: "stop"
  
  metadata:
    author: "restorex"
    version: "1.0"
    tags: ["analysis", "structure"]
