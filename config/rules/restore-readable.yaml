version: "1.0"
rule:
  id: "restore-readable"
  name: "还原可读代码"
  description: "执行还原，生成可读代码，可选运行时证据回灌"
  
  responsibilities:
    - "应用符号映射"
    - "生成可读代码"
    - "可选运行时证据采集"
    - "作用域改名应用"
  
  constraints:
    - "基于证据矩阵"
    - "拦截可疑改名"
    - "保留原始副本"
  
  preconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/analysis/evidence_matrix.json"
  
  action:
    type: "sequential"
    steps:
      # 可选：运行时证据采集
      - name: "collect-runtime-evidence"
        type: "cli"
        command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} --runtime-prefer-direct collect-runtime-evidence"
        timeout: 120
        optional: true  # 失败不影响主流程
      - name: "ingest-runtime-evidence"
        type: "cli"
        command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} ingest-runtime-evidence"
        timeout: 120
        optional: true
      - name: "refresh-evidence"
        type: "cli"
        command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} build-evidence"
        timeout: 300
        optional: true
      # 主还原步骤
      - name: "restore-v1"
        type: "cli"
        command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} restore-v1"
        timeout: 600
      - name: "apply-scope-renames"
        type: "cli"
        command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} apply-scope-renames"
        timeout: 300
        optional: true
  
  postconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/restore_v1/readable/pages/index.html"
    - type: "directory_not_empty"
      path: "{workspace}/output/{run_id}/restore_v1/readable/assets"
  
  on_failure:
    action: "stop"
    message: "还原失败"
  
  metadata:
    author: "restorex"
    version: "1.0"
    tags: ["restore", "rename", "readable"]
