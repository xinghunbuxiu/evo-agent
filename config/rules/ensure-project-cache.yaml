version: "1.0"
rule:
  id: "ensure-project-cache"
  name: "确保项目缓存存在"
  description: "验证项目缓存目录结构完整，为后续步骤提供基础"
  
  # 职责定义
  responsibilities:
    - "验证 cache/project 目录存在"
    - "验证必要配置文件存在"
    - "不修改任何缓存内容，仅检查"
  
  # 约束条件
  constraints:
    - "不允许修改缓存"
    - "不允许创建新缓存"
    - "仅负责验证，不负责修复"
  
  # 前置条件
  preconditions:
    - type: "directory_exists"
      path: "{workspace}"
    - type: "directory_exists"
      path: "{workspace}/cache"
  
  # 执行动作
  action:
    type: "cli"
    command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} ensure-project-cache"
    working_dir: "{workspace}"
    timeout: 60
  
  # 后置条件（验收标准）
  postconditions:
    - type: "directory_exists"
      path: "{workspace}/cache/project"
      description: "项目缓存目录必须存在"
  
  # 失败处理
  on_failure:
    action: "stop"
    message: "项目缓存缺失，请检查环境配置"
  
  # 元信息
  metadata:
    author: "restorex"
    version: "1.0"
    tags: ["init", "cache", "validation"]
