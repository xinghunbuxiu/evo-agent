version: "1.0"
rule:
  id: "build-evidence"
  name: "构建证据"
  description: "整合画像和链路信息，构建证据矩阵，生成还原计划"
  
  responsibilities:
    - "整合多源证据"
    - "生成符号映射候选"
    - "去重和冲突解决"
    - "生成还原脚本计划"
  
  constraints:
    - "不执行实际替换"
    - "仅生成证据和计划"
    - "高置信度优先"
  
  preconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/analysis/chain_graph.json"
  
  action:
    type: "sequential"
    steps:
      - name: "build-evidence"
        type: "cli"
        command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} build-evidence"
        timeout: 300
      - name: "build-script-plan"
        type: "cli"
        command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} build-script-plan"
        timeout: 300
  
  postconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/analysis/evidence_matrix.json"
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/analysis/symbol_map_seed.json"
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/analysis/restore_script_plan.json"
  
  on_failure:
    action: "stop"
  
  metadata:
    author: "restorex"
    version: "1.0"
    tags: ["evidence", "plan", "symbol"]
