version: "1.0"
rule:
  id: "verify"
  name: "验证还原结果"
  description: "验证还原结果的正确性和完整性"
  
  responsibilities:
    - "验证改名契约"
    - "检查命名冲突"
    - "评估还原质量"
    - "生成反馈和校准数据"
  
  constraints:
    - "必须生成验证报告"
    - "失败需诊断"
    - "通过才能收尾"
  
  preconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/restore_v1/readable/pages/index.html"
  
  action:
    type: "sequential"
    steps:
      - name: "verify"
        type: "cli"
        command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} verify"
        timeout: 300
      - name: "build-feedback"
        type: "cli"
        command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} build-feedback"
        timeout: 300
      - name: "verify-again"
        type: "cli"
        command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} verify"
        timeout: 300
      - name: "diagnose-pipeline"
        type: "cli"
        command: "python3 src/engine/restorex_cli.py --workspace {workspace} --rule-profile {profile} --run-id {run_id} diagnose-pipeline"
        timeout: 300
  
  postconditions:
    - type: "file_exists"
      path: "{workspace}/output/{run_id}/reports/verify_report.json"
    - type: "json_path"
      file: "{workspace}/output/{run_id}/reports/verify_report.json"
      json_path: "ok"
      expected: true
  
  on_failure:
    action: "stop"
    message: "验证失败，请查看诊断报告"
  
  metadata:
    author: "restorex"
    version: "1.0"
    tags: ["verify", "quality", "feedback"]
