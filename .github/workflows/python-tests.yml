name: Python regression tests

on:
  push:
    branches: [main, "automation/**", "infra/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-regression-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    # Persistent self-hosted runners must not execute untrusted fork PR code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Use the runner's installed Python to avoid a slow/unreliable Python download from GitHub Releases.
    # Setup instructions: docs/SELF_HOSTED_CI_CN.md
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Diagnose self-hosted runner before checkout
        run: |
          set -euxo pipefail
          date -u
          uname -a
          id
          git --version
          python3 --version
          df -h
          df -i
          printf 'GITHUB_WORKSPACE=%s\n' "$GITHUB_WORKSPACE"
          ls -ld "$GITHUB_WORKSPACE" || true
          timeout 10s git ls-remote https://github.com/xinghunbuxiu/evo-agent.git HEAD
      - name: Check out repository
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
          show-progress: true
      - name: Verify Python and create virtual environment
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip --version
      - name: Install runtime dependencies
        run: |
          set -o pipefail
          .venv/bin/python -m pip install -r requirements.txt 2>&1 | tee dependency-install-output.txt
      - name: Run regression suite
        run: |
          set -o pipefail
          .venv/bin/python scripts/run_regression_with_tree.py 2>&1 | tee regression-test-output.txt
      - name: Upload regression output
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: python-regression-output
          path: '*-output.txt'
          if-no-files-found: warn
