name: Python regression tests

on:
  push:
    branches: [main, "automation/**", "infra/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Requires the repository-level Linux VPS runner to be Online with these labels.
    # Setup instructions: docs/SELF_HOSTED_CI_CN.md
    runs-on: [self-hosted, linux, x64, evo-agent]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: |
          set -o pipefail
          python -m pip install -r requirements.txt 2>&1 | tee dependency-install-output.txt
      - name: Run regression suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee regression-test-output.txt
      - name: Upload regression output
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: python-regression-output
          path: '*-output.txt'
          if-no-files-found: warn
